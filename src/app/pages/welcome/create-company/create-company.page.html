<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/welcome"></ion-back-button>
    </ion-buttons>
    <ion-title>createCompany</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">createCompany</ion-title>
    </ion-toolbar>
  </ion-header>
  <form [formGroup]="createCompanyForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Nombre de la Empresa</ion-label>
      <ion-input formControlName="companyName" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Número de Horas</ion-label>
      <ion-input formControlName="hours" type="number"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Descripción</ion-label>
      <ion-textarea formControlName="description"></ion-textarea>
    </ion-item>

    <ion-button expand="block" type="submit" [disabled]="createCompanyForm.invalid">Guardar</ion-button>
  </form>
</ion-content>
