<ion-content [fullscreen]="true" color="light">

  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/welcome"></ion-back-button>
    </ion-buttons>

  </ion-toolbar>
  <app-custom-header [little]="true" [title]="'Crear Empresa'">
  </app-custom-header>

  <form [formGroup]="createCompanyForm" >
    <ion-list [inset]="true">
      <ion-item>
        <!-- <ion-label position="floating">Nombre de la Empresa</ion-label> -->
        <ion-input label="Nombre" formControlName="companyName" type="text"></ion-input>
      </ion-item>

      <ion-item>
        <!-- <ion-label position="floating">Descripción</ion-label> -->
        <ion-textarea label="Comentario" labelPlacement="floating" rows="5" formControlName="description"></ion-textarea>
      </ion-item>
    </ion-list>

  </form>
</ion-content>

<app-custom-footer-button [disabled]="createCompanyForm.invalid" [buttonText]="'Guardar'" (actionClick)="onSubmit()">
</app-custom-footer-button>
